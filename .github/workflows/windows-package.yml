name: Windows package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the leading v
        required: true
        default: 0.6.0-beta.7
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop-connector/packaging/requirements-build.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r packaging/requirements-build.lock
          python -m pip install --no-deps -e .
      - name: Test
        run: python -m pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Build Windows packages
        shell: pwsh
        run: |
          $releaseVersion = "${{ inputs.release_version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseVersion = "${{ github.ref_name }}" -replace '^v', ''
          }
          .\packaging\build-windows.ps1 -ReleaseVersion $releaseVersion
      - uses: actions/upload-artifact@v4
        with:
          name: rokidhub-desktop-connector-windows
          path: desktop-connector/artifacts/*
          if-no-files-found: error

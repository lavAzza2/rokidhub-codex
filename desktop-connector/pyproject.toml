[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rokidhub-desktop-connector"
version = "0.6.0b7"
description = "Outbound-only Windows connector between RokidHub and local Codex app-server"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.1", "certifi>=2025.8.3"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.2", "Pillow==12.3.0"]

[project.scripts]
rokidhub-connector = "rokidhub_desktop_connector.cli:main"
rokidhub-connector-gui = "rokidhub_desktop_connector.gui:script_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rokidhub_desktop_connector = ["assets/*.ico", "assets/*.png", "assets/*.ttf", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

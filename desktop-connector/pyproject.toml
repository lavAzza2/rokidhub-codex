[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rokidhub-desktop-connector"
version = "0.6.0b1"
description = "Outbound-only Windows connector between RokidHub and local Codex app-server"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "certifi>=2025.8.3"]

[project.optional-dependencies]
build = ["PyInstaller>=6.15,<7"]

[project.scripts]
rokidhub-connector = "rokidhub_desktop_connector.cli:main"
rokidhub-connector-gui = "rokidhub_desktop_connector.gui:script_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rokidhub_desktop_connector = ["assets/*.ttf", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
